# Stack da Carneiro & Ziller na VPS COMPARTILHADA da Gran Consultoria (31.97.175.225).
# O docker-compose.yml da raiz é o ambiente LOCAL; este é o de produção.
#
# A máquina já roda outros clientes e o `nginx-proxy` é dono das portas 80/443:
#   - só `site` entra na `proxy-network`; o nginx-proxy alcança também o `s3`
#     (fotos em /cz-fotos/), por isso ele está nas duas redes;
#   - banco e S3 publicam porta só em 127.0.0.1, para o deploy (túnel SSH da
#     máquina do dev) migrar, criar o bucket e pré-renderizar no build;
#   - o TLS termina na Cloudflare + Origin Certificate no nginx-proxy.
#
# Na VPS: ~/projetos/clientes/carneiro-ziller/site/{docker-compose.yml,.env}
#   docker compose up -d
# Passo a passo: deploy/README.md
name: carneiro-ziller

services:
  db:
    image: postgres:17
    container_name: carneiro-ziller-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: carneiro_ziller
    ports:
      - "127.0.0.1:15433:5432"
    volumes:
      - banco:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cz -d carneiro_ziller"]
      interval: 10s
      timeout: 5s
      retries: 10
    labels:
      service: carneiro-ziller-db
      environment: production

  s3:
    # A MinIO parou de publicar imagens no Docker Hub (2025); a Chainguard compila o
    # MinIO de código aberto e mantém atualizado. Fixada por digest (MinIO
    # RELEASE.2026-10-23): atualizar é trocar o digest de propósito.
    image: cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    container_name: carneiro-ziller-s3
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?defina no .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?defina no .env}
      MINIO_BROWSER: "off"
    ports:
      - "127.0.0.1:19010:9000"
    volumes:
      - fotos:/data
    networks:
      - default
      - proxy-network
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
    labels:
      service: carneiro-ziller-s3
      environment: production

  site:
    image: carneiro-ziller-site:latest
    container_name: carneiro-ziller-site
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cz:${POSTGRES_PASSWORD}@db:5432/carneiro_ziller
      # O navegador envia as fotos direto ao S3 pela URL assinada, então o endpoint
      # é o público (o nginx-proxy repassa /cz-fotos/ ao `s3`). Mesma origem do site:
      # sem CORS.
      S3_ENDPOINT: ${SITE_URL:?defina no .env}
      S3_REGIAO: us-east-1
      S3_BUCKET: cz-fotos
      S3_FORCE_PATH_STYLE: "true"
      FOTOS_URL_PUBLICA: ${SITE_URL}/cz-fotos
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
    networks:
      - default
      - proxy-network
    mem_limit: 768m
    healthcheck:
      # 127.0.0.1, não "localhost": o Next escuta em IPv4.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      service: carneiro-ziller-site
      domain: ${SITE_DOMINIO:-}
      environment: production

networks:
  default:
  proxy-network:
    external: true

volumes:
  banco:
    name: carneiro-ziller_banco
  fotos:
    name: carneiro-ziller_fotos
