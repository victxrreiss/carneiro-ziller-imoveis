# /home/granconsultoria/projetos/nginx/conf.d/carneiro-ziller.conf
# Cliente: Carneiro & Ziller Imóveis — site, catálogo e painel dos corretores
# Containers: carneiro-ziller-site, carneiro-ziller-s3 (fotos)
# Localização: /home/granconsultoria/projetos/clientes/carneiro-ziller/site
#
# Domínio: carneiroziller.com.br (Cloudflare do cliente + Origin Certificate em
# nginx/ssl/carneiro-ziller.{crt,key}). O www e o endereço temporário da Gran
# (carneiroziller.granconsultoria.com.br) redirecionam para ele.
#
# As zonas de limite vivem no contexto http, compartilhado por todos os clientes da VPS:
# por isso o prefixo "carneiro_". Nome repetido em outro arquivo derruba o reload de todo mundo.
# O upstream é resolvido em tempo de execução (resolver do Docker + variável): se os
# contêineres estiverem parados quando o nginx-proxy reiniciar, só este site responde 502.
limit_req_zone $binary_remote_addr zone=carneiro_interesse:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=carneiro_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name carneiroziller.com.br www.carneiroziller.com.br carneiroziller.granconsultoria.com.br;
    return 301 https://carneiroziller.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.carneiroziller.com.br;

    ssl_certificate /etc/nginx/ssl/carneiro-ziller.crt;
    ssl_certificate_key /etc/nginx/ssl/carneiro-ziller.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://carneiroziller.com.br$request_uri;
}

# Endereço temporário (antes do domínio do cliente): links antigos continuam valendo.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carneiroziller.granconsultoria.com.br;

    ssl_certificate /etc/nginx/ssl/granconsultoria.crt;
    ssl_certificate_key /etc/nginx/ssl/granconsultoria.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://carneiroziller.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name carneiroziller.com.br;

    ssl_certificate /etc/nginx/ssl/carneiro-ziller.crt;
    ssl_certificate_key /etc/nginx/ssl/carneiro-ziller.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/carneiro-ziller_access.log;
    error_log /var/log/nginx/carneiro-ziller_error.log warn;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $carneiro http://carneiro-ziller-site:3000;
    set $carneiro_s3 http://carneiro-ziller-s3:9000;
    # X-Forwarded-For é sobrescrito com o IP real (CF-Connecting-IP, acima), não
    # acrescentado: o app limita envios pelo primeiro valor, que o cliente forjaria.

    client_max_body_size 1m;

    # Fotos (bucket cz-fotos no MinIO): leitura pública e o PUT assinado do painel.
    # Sem reescrever o caminho e com o Host original: a assinatura S3 cobre os dois.
    location /cz-fotos/ {
        # Fotos de até 15 MB (LIMITES.fotoMB do painel).
        client_max_body_size 16m;
        proxy_request_buffering off;
        proxy_pass $carneiro_s3;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nunca listar o bucket nem expor outros endpoints do MinIO.
        limit_except GET HEAD PUT { deny all; }
    }

    # O app já limita por IP (10/h); isto segura rajadas antes de chegar nele.
    location = /api/interesses {
        limit_req zone=carneiro_interesse burst=4 nodelay;
        limit_req_status 429;
        proxy_pass $carneiro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /painel/entrar {
        limit_req zone=carneiro_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $carneiro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Só pela rede interna (deploy/cron-limpeza.sh chama o contêiner direto).
    location ^~ /api/cron/ {
        return 404;
    }

    location / {
        proxy_pass $carneiro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
