# Ambiente local completo: Postgres, armazenamento S3 e caixa de e-mail.
# Sobe com `npm run db:subir`. Credenciais abaixo são só de desenvolvimento.
name: carneiro-ziller

services:
  banco:
    image: postgres:17
    environment:
      POSTGRES_USER: cz
      POSTGRES_PASSWORD: cz_local
      POSTGRES_DB: cz_dev
    ports:
      - "${CZ_PORTA_BANCO:-5432}:5432"
    volumes:
      - dados-banco:/var/lib/postgresql/data
      # Cria também o banco dos testes e2e (cz_e2e), separado do de desenvolvimento.
      - ./docker/criar-banco-e2e.sql:/docker-entrypoint-initdb.d/01-e2e.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cz -d cz_dev"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Servidor S3 local. Mesma imagem (MinIO, fixada por digest) usada em produção;
  # pode ser trocada por qualquer servidor S3 mantido (o app só fala o protocolo S3).
  # Os buckets cz-dev e cz-e2e são criados por `npm run db:subir` (scripts/preparar-s3.ts), com leitura pública.
  s3:
    image: cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: czlocal
      MINIO_ROOT_PASSWORD: czlocal-secret
      # CORS: o navegador envia a foto direto ao bucket (PUT) a partir do site.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:3100"
    ports:
      - "${CZ_PORTA_S3:-9000}:9000"
      - "${CZ_PORTA_S3_CONSOLE:-9001}:9001"
    volumes:
      - dados-s3:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  email:
    image: axllent/mailpit:latest
    ports:
      - "${CZ_PORTA_SMTP:-1025}:1025" # SMTP
      - "${CZ_PORTA_MAILPIT:-8025}:8025" # caixa de entrada: http://localhost:8025

volumes:
  dados-banco:
  dados-s3:
